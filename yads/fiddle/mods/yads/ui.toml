# YADS — UI strings (notification + network-view panel labels).
# Flat top-level keys only: the localization registration for this file
# (localization/l10n.meta.toml) uses a single wildcard entry
# `"mods/yads/ui" = ["*"]`, which covers every top-level key here.
# GML reads these as `mods/yads/ui/<key>` via local_get()/create_notification().

# Shown when interacting with an Access Panel that has no Storage Heart on its network.
no_heart = "No Storage Heart connected to this panel."

# Shown when a deposit could not fit anywhere on the network (overflow went back to the player).
network_full = "Network storage is full."

# Sort-cycle button labels, one per sort mode.
sort_category = "Category"
sort_name = "Name"
sort_value = "Value"
sort_count = "Count"
# Fifth sort mode: sorts by the stack's total value (unit value * count)
# rather than sort_value's per-unit value. Cycle order: Category -> Name ->
# Value -> Stack val -> Count (STACK_VALUE is mode 3, immediately after VALUE -
# the two are the same question at two scales).
#
# MEASURED, NOT CHOSEN. The sort button is 58px and the label the engine builds
# for it reflows at parent.width - required_padding = 58 - 6 = 52px
# (Node.gml:963, :1069-1074, :1099-1109). "Stack Value" is 64px in the standard
# font (assets/fiddle/fonts/text_widths.toml) and wrapped to two lines that
# overflowed the 14px button by ~6px top and bottom, in every locale - this key
# has no translations, so the English width is the only width. "Stack val" is
# 50px and clears with 2px to spare. The period is missing on purpose: "Stack
# val." is 52px, i.e. exactly the budget, and a wrap fix must not ship a new
# boundary condition. If this string is ever re-worded, measure it against that
# table first and keep it under 52.
sort_stack_value = "Stack val"

# Search box placeholder text.
search_placeholder = "Search items..."

# Page indicator pattern; GML fills the two placeholders with (current page, total pages).
#
# NO "Page" PREFIX, and it cannot come back. The counter is centred in a 72px
# pager cluster between two 5px arrows, so it has 62px; "Page 100 / 100" is 77px
# in the standard font and would overrun both arrows. "100 / 100" is 49px. The
# cluster is 72 rather than 88 so the left arrow clears the glyph guide's ESC
# backplate, which is 80px wide in Russian; see the layout comment over the pager
# in view.gml. A fraction between two arrows needs no noun, and this key has no
# translations, so the English width is the width in every language. Keep any
# replacement under 62px.
#
# THREE DIGITS IS THE NUMBER TO BUDGET FOR, not two. Pages are driven by CELLS,
# not by distinct item ids: yads_project splits every row into
# ceil(total / max_stack) cells and pages them 45 at a time, so the ceiling is set
# by occupied member SLOTS. 35 Storage Blocks are 1,050 slots and already pass 23
# pages with one item kind in them. Measured against fonts/text_widths.toml
# (digit 6, space 3, "/" 7): "23 / 23" 37px, "100 / 100" 49px, "999 / 999" 49px,
# "1000 / 1000" 61px against the 62px interior. Four digits needs ~45,000 cells
# (about 1,500 blocks - placeable on the 188x144 farm grid, absurd but not
# impossible) and still fits by a pixel; five digits needs more grid than the farm
# has. The label physically cannot overrun - but budget it from the cell count, not
# from an item-id count that has nothing to do with it.
page_label = "{} / {}"

# --- Auto-search toggle ----------------------------------------------------
# Button label AND the shared tooltip text when this button is hovered - the
# toggle always displays (and describes) its own current state.
autosearch_on  = "Auto-search: on"
autosearch_off = "Auto-search: off"

# --- Heart status GUI ------------------------------------------------------
status_title      = "Storage Network"
# One row per connected block. {} = block number, {} = fill percent.
status_block_row  = "Block {}"
status_percent    = "{}%"
# Footer line, left side. Exactly ONE placeholder: {} = percent.
# (Used/total slot counts live in status_slots, the right side of the row.)
status_total      = "Network {}% full"
status_slots      = "{} / {} slots"
# Header line under the title. {} = number of connected Storage Blocks.
status_blocks     = "{} blocks connected"
# Shown instead of the row list when the heart has no blocks yet.
status_no_blocks  = "No Storage Blocks connected."
# Shown when the network has no Access Panel - the only browsing surface.
status_no_panel   = "Craft an Access Panel to browse this network."

# --- Sealed block toast ----------------------------------------------------
block_sealed      = "This block is part of a storage network. Use an Access Panel."

# --- Swing-protected unit toast --------------------------------------------
# Shown once per attempt, on the first counted swing against a non-empty unit.
# The resource.node_modifier hook in network.gml suppresses node.destructable
# for the duration of each pick_node call until 5 attempts have landed, counting
# at most one per frame so that a wide charged swing (or a bomb blast, which
# covers several cells at once) is one attempt and not six.
#
# "UNIT", NOT "BLOCK". The filter claims all three kinds, and the other two can
# legitimately hold items - the Heart via the documented Throw side-door and via
# any save older than the blocks-only deposit rule, the Panel (4 slots) via
# Throw - so "block" would name something the player is not hitting.
#
# "4 MORE", NOT "5 TIMES". The toast fires on the call that takes the counter to
# 1, so one of the five is already spent when the player reads it. This is the
# only number the feature exposes and it has to match what the player will
# actually experience.
# The count is hard-coded here: this number is YADS_PICK_SWINGS - 1, and changing
# that macro means editing this string in the same pass.
block_protected   = "This unit contains items - 4 more swings to break it."

# --- Row-6 filter bar ------------------------------------------------------
# The filter bar carries one button per raw category bucket (yads_category,
# network.gml) plus All and the Museum toggle - 16 slots, paged 8-at-a-time.
# Most buckets already have a translated vanilla label (misc_local/*, read-only,
# NEVER write to that file) and are wired straight to those keys with no ui.toml
# entry needed. filter_farming names a coarser group from an older taxonomy and
# no longer labels a bucket: nothing in yads_filter_label_key (view.gml) returns
# it. It is NOT unreferenced, though — do not delete it. view.gml:1347 passes it
# to the hint label's set_key() as that node's construction-time placeholder.
# The string is never rendered (hint_plate is built .set_enabled(false) and
# yads_hint_think always set_key()s the real key before enabling it), but
# removing the key would leave a dangling reference. Kept also for any
# translation that may already exist against it.
filter_farming    = "Farming"
filter_fish_bugs  = "Fish & Bugs"
# Buckets with no vanilla misc_local equivalent - mod keys, spelled exactly as
# the GML switch that reads them expects.
filter_crops      = "Crops & Forage"
filter_seeds      = "Seeds & Saplings"
filter_flooring   = "Flooring & Wallpaper"
filter_scrolls    = "Scrolls & Unlocks"

# --- Museum filter toggle --------------------------------------------------
# Group 15 of the sixteen rotating filter buttons, and it REPLACES the active
# category rather than intersecting with it: yads_project's filter pass tests
# `_museum` and the category match as the two arms of one if/else, so selecting
# "Museum needs" drops whatever category was selected. It ANDs with the SEARCH
# STRING only.
# Icon pair spr_ui_generic_icon_museum_off/on mirrors the vanilla tooltip's own
# marker.
filter_museum     = "Museum needs"

# --- Remote Access Panel (Beta 1.2) ----------------------------------------
# The remote's own name and description are NOT here: they live in
# fiddle/items/furniture/netstor_set.toml, which the game's own
# `"items/" = ["*/name", "*/description"]` localization entry already covers.
# These five are the toasts the GML raises around it.
#
# EVERY ONE OF THESE IS A LOC KEY, NEVER A FORMATTED STRING. create_notification
# resolves whatever it is handed through local_get (InfoToastsMenu.gml:31 in
# create_notification, and again at :121), so a toast can only carry text that
# already exists as a key. That is why none of them names a number: it would
# have to be substituted in before the lookup, and a miss returns the key,
# undefined or "MISSING" depending on the path (mmapi_local.gml:37 guards all
# three), i.e. there is no safe way to put a digit in a toast. The picker's
# keys at the bottom of this file are the other case - they are TEXT NODES, and
# a text node's pattern is resolved first and filled by format() afterwards.

# Handing a remote to a Storage Heart while holding it: the link is made.
remote_linked     = "Linked to this Storage Heart."
# The heart's own 54 slots are full, so the remote has nowhere to sit. Nothing
# moved: the remote is still in the player's hand.
remote_heart_full = "This Storage Heart is full - clear a slot to link."
# Hotkey pressed with no remote in any Storage Heart anywhere.
remote_none       = "No Storage Heart is linked. Hand a Remote Access Panel to one."
# (remote_multiple was deleted in Beta 1.2's picker pass. It apologised for a
# guess the mod no longer makes: with several networks bound and no default set,
# the hotkey now opens the picker instead of the first heart in registry order.
# The loc closure gate forbids a shipped key nothing resolves.)
# A remote was dropped into the network view. Refused and handed straight back:
# a remote parked in a Storage Block is a binding nothing can read.
remote_no_deposit = "Link a remote by handing it to a Storage Heart."
# The config file named a key mmapi cannot resolve, so the mod took F6 and the
# full gesture ladder with it (boot.gml section 5). Raised once per process, on
# the first press that could act - the log line alone is invisible, and the boot
# frame is no place to raise a toast. It names no key and carries no
# placeholder, which is what lets it be a toast at all.
remote_key_bad    = "Remote key not understood - using F6. Rebind it in the network picker."

# --- Value badge cycle button ----------------------------------------------
# Bottom-bar toggle in the same family as autosearch_on/off above: the button
# always shows (and its tooltip always describes) the CURRENT state, cycling
# off -> stack -> unit on tap. Persisted like auto_search.
value_off         = "Values: off"
value_stack       = "Values: per stack"
value_unit        = "Values: per item"

# --- The network picker (Beta 1.2) -----------------------------------------
# The list a HOLD of the remote hotkey opens, and that a TAP opens when several
# networks are bound and none of them has been made the default. One row per
# bound Storage Heart; the row opens that network, the checkbox beside it makes
# that network the one a tap goes to. See view.gml section 7.
#
# THESE ARE TEXT NODES, NOT TOASTS, so unlike the remote_* keys above they may
# carry placeholders: the pattern is resolved through local_get first and
# format() fills it, which is the same idiom the pager's counter and every
# status row use. A toast could not do this - create_notification looks up
# whatever string it is handed (InfoToastsMenu.gml:31), so a formatted one
# misses.
picker_title      = "Storage Networks"
# Row name when the game has no display name for the location. {} = row number.
# Reached for the greenhouses, barns, coops and the mini-museum, whose
# locations.toml tables carry no `name` - the farm and the house have one.
picker_network    = "Network {}"
# Two hearts whose rows would read the same. {} = name, {} = 2, 3, ...
picker_dup        = "{} ({})"
# The right-hand half of a row. {} = connected Storage Blocks, {} = how full the
# whole network is. Budget: "35 blocks, 100%" is 80px in the standard font
# against a 208px row, which leaves ~105px for the name (trimmed to 14
# characters plus a possible " (2)"). Measure any replacement against
# assets/fiddle/fonts/text_widths.toml before widening it.
picker_summary    = "{} blocks, {}%"
# The hint line under the list, state A: no default set yet. This is the
# checkbox column's only caption - a 16px column has no room for a header - so
# it has to say what the box does, not just that it exists. It ALSO names the
# hold, because the hold is the only route to this list and to the Rebind button
# in its footer: a player who never learns it cannot reach the mod's settings at
# all (boot.gml section 5c, view.gml section 7c). {} = the key name of the LIVE
# binding, exactly as in picker_hold_hint below.
#
# "Tick a default, hold PAGE_DOWN = this list" is 224px, 173px with "F6".
picker_default    = "Tick a default, hold {} = this list"
# The hint line under the list, state B: a default IS set, so a tap of the
# hotkey no longer asks. {} = the key name of the LIVE binding, produced by
# mmapi_hotkey_name_from_vk(_rt.remote_vk) - never the raw remote_hotkey string
# out of the config file, which may be an unresolvable name the fallback left
# in place (view.gml section 7c).
#
# MEASURED AGAINST THE LONGEST KEY NAME mmapi will resolve, which is
# "PAGE_DOWN": "Tap PAGE_DOWN = default, hold = this list" is 220px against the
# 250px plate. With "F6" it is 169px. Keep any replacement under 240px with
# PAGE_DOWN substituted in; this key has no translations, so the English width
# is the width in every language. The same budget governs picker_default above,
# which is why both are re-measured together.
picker_hold_hint  = "Tap {} = default, hold = this list"

# --- The rebind capture (view.gml section 7f) ------------------------------
# The footer button that starts the capture, and the five lines the hint shows
# while and just after it runs. Every one of these is a TEXT NODE like the
# picker keys above, so the four with {} in them are safe: the pattern is
# resolved through local_get first and format() fills it afterwards.
#
# MEASURED AGAINST THE LONGEST NAME THE VOCABULARY OFFERS, "PAGE_DOWN", against
# the same 240px budget picker_hold_hint holds on a 250px plate: deny_game 230,
# deny_reserved 222, set 188, set_letter 230, set_f12 190, bind_failed 236,
# capture 173. Three of those can never actually reach nine characters -
# set_letter is only ever fed one letter (174px), set_f12 only ever "F12"
# (145px), and bind_failed only ever a name that PASSED the verdict, whose
# longest is "INSERT"/"DELETE" (215px) - but they are budgeted at the worst case
# anyway. These keys have no translations, so the English width is the width in
# every locale; measure any replacement against
# assets/fiddle/fonts/text_widths.toml with PAGE_DOWN substituted in.

# The footer button, beside Close. NOT a text node - this one is read by
# PopupMenu.create_button, which sizes the button to
# max(60, string_width(label) + 18). "Rebind key" is 56px -> a 74px button,
# which clears the Close button beside it by 12px in its widest translation.
# Re-measure before re-wording: a label past 68px would make the two footer
# buttons overlap, and two overlapping tap targets is the one thing
# docs/anchor-ui-facts.md forbids outright.
picker_rebind     = "Rebind key"
# Shown for as long as the picker is listening for a key. "ESC" is spelled out
# rather than glyphed because the cancel is read through InputId.MenuBack, which
# a player may have rebound - the word names the default, and the Close button
# below still carries the real glyph for whatever they bound it to.
picker_capture    = "Press a key to use - ESC cancels"
# Refused: the key is in the player's LIVE control bindings. {} = the key name.
picker_deny_game  = "{} is a game control - try another"
# Refused: the key belongs to this mod's pager, to mmapi's debug agent, or is
# one of the two modifiers the search editor reads raw (SHIFT, CONTROL).
# {} = the key name.
picker_deny_reserved = "{} is reserved - try another key"
# Taken, with nothing to add. {} = the key name.
picker_set        = "{} is now your remote key"
# Taken, but it is a letter - and the hotkey poll has no text-focus test, so it
# also types into the network view's own search box. {} = the letter.
picker_set_letter = "{} set - it types in the search box"
# Taken, but Steam's overlay claims F12 for screenshots on most installs.
# {} = "F12".
picker_set_f12    = "{} set - Steam may take it"
# NOT taken: the key passed every policy test but mmapi's registration was
# refused by the engine, so nothing is listening for it. The capture stays open
# after this line, so "try another" is literal. {} = the key name.
picker_bind_failed = "{} could not be bound - try another"
