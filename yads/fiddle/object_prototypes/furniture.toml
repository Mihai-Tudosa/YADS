# YADS — object prototypes for the Netstor Set.
#
# ⚠ THE `netstor_*` KEYS ARE FROZEN FOREVER. Content keys are save-serialized BY
# NAME: the grid writes `object_id` as a string and Grid.load_objects looks it
# back up with try_string_to_object_id, dropping any node whose name no longer
# resolves — WITH ITS WHOLE INVENTORY (Grid.gml:1075-1080). Renaming a key here,
# in `fiddle/items/furniture/netstor_set.toml`, or in any `spr_*netstor*` sprite
# would delete every placed unit and everything inside it from existing saves.
# The mod was rebranded to YADS in Beta 1.0; these keys deliberately did not move.
#
# WARNING: this file MOMI-merges into the game's own `fiddle/object_prototypes/furniture.toml`
# (MergeTomlTables, R1 §2.7). It must contain ONLY the three keys below — any stray key
# (including a [default] table) would merge into and corrupt vanilla furniture data.
#
# Shape copied verbatim from the vanilla chest template `basic_wood_chest_dark`
# (R4 Q1a): size + one `.south` sprite/offset + `.interaction_chest`. All other fields
# (collision_grid, rule_grid, placeable_locations, etc.) are intentionally omitted so they
# inherit from the game's [default] furniture table. No interact_mask, no other interaction
# data — interaction_chest is mutually exclusive with interaction_turn_on/bed_kind/is_journal
# (R1 §2.2 warn).
#
# ⚠ NEVER ADD `child_grid` TO ANY OF THE THREE. It would silently void the whole
# five-swing removal guard (gml/network.gml section 10). `destructable = false`
# is not a hard veto in this engine: both readers cancel it the moment ANY child with a
# destructable prototype stands on the node's own surface — Pick.gml:411-429 inside
# pick_node (`if cannot_destroy { for (target_list) if …prototype.destructable {
# cannot_destroy = false; break; } }`) and the same override in can_pick_node at
# Pick.gml:34-52. The vanilla [default] we inherit sets `child_grid = false`, so
# node.child_grid is undefined, the collected target list is empty and the loop never
# runs. Give a unit a tabletop — the natural "a Storage Block you can set a lamp on"
# request — and a player defeats the guard by putting any ordinary item on top of it,
# on both the can_pick_node and the pick_node path, with no other symptom.
#
# --- SQUEEZE-BETWEEN COLLISION (Beta 1.0) ------------------------------------
# `collision_grid` is per-cell and independent of the FOOTPRINT. The footprint
# (`size`) still occupies all 4x2 cells: placement is refused on any cell whose
# `node_object_id` is set (GridUtils.gml:76-77), the network BFS walks nodes,
# interact/pick address nodes, and serialization stores nodes — none of them
# reads collision. All `collision_grid` decides is which of those cells the
# player's body is stopped by (Furniture.gml:674 -> GridUtils.gml:559-585).
#
# "0110" leaves the outer column of each row walkable and keeps a solid 2-cell
# (16px) core. Cells are 8x8, so two units placed side by side now have an 8px
# margin each, i.e. a 16px corridor between their solid cores. Ari's collision
# mask is a box 8px wide (assets/shapes/Interact Masks/poly_character_mask.meta
# .toml: kind = "box", dimensions = [8, 5], offset = [-4, -2]; obj_ari.gml:7
# sets mask_index = spr_character_mask), and the engine's slip assist scans 4px
# either way when it meets a collision (misc/movement_speeds/slip_size = 4,
# misc.toml). 8 + 4 + 4 = 16 exactly, so the corridor is passable even on a
# badly aimed approach, and the crates still feel solid when you walk into them.
# The wider ["0100","0100"] variant (24px corridor) was rejected: an 8px core is
# a quarter of the sprite and reads as furniture you walk through.
#
# 0 IS THE ONLY SAFE "no collision" VALUE. Never write "-" (= -1): that arm of
# set_collision_grid_flag_on_node briefly forces a RoomEditorCollision.Active
# cell to None so that remove_collision_on_node takes the destructive branch,
# then hands the marker back as Inactive (GridUtils.gml:569-579) — it erases at
# PLACEMENT time whatever collision the cell already carried. 0 takes the benign
# arm and only clears `node_pathfinding_sitting` (:567-568).
#
# Be precise about what 0 buys, because the obvious reading is too strong: it is
# NOT "the room's collision is safe for good". `erase_object_node_data` calls
# remove_collision_on_node over EVERY footprint cell unconditionally, whatever
# the collision_grid said (GridUtils.gml:367-373), so a RoomEditorCollision.None
# cell loses its collision when the unit is removed either way. 0 preserves that
# collision only WHILE THE UNIT IS THERE; "-" would strip it a whole placement
# earlier and with no unit standing over it. Room-editor cells are round-trip
# safe in both directions and are not the concern here (set_collision_on_node
# early-returns on Active, :429-431; remove_collision_on_node restores from
# room_data_read_cell on Inactive, :474-485). There is no refcount to underflow:
# `node_collideable` is a plain bool array (Grid.gml:30).
#
# Vanilla precedent for a partial grid on a placeable: `perpetual_soup_pot`
# ships ["011110", "011110", "011110"] on a 6x3 footprint.
#
# THIS IS NOT A MIGRATION. Loading a save re-derives collision from the CURRENT
# prototype as each node is written back, so units already placed in an Alpha
# save pick the new grid up on the next load with no save edit of any kind.
#
# --- NO `check_pick` (Beta 1.0, deliberately) --------------------------------
# `check_pick = true` was tried during Beta 1.0 and REVERTED. Do not re-add it.
# It reads as "you cannot yank the thing out from under your own feet", but both
# readers test overlap against the RENDERER INSTANCE's shape at the renderer's
# own position (can_pick_node Pick.gml:25-31, pick_node Pick.gml:433-439), not
# against the 4x2 footprint. Our renderer shapes are 26x23/27/29, extending
# 8-14px above the footprint, so the refusal reaches one to two cell rows NORTH
# of the unit — the ordinary place to stand when breaking a 48px-tall crate.
# Worse, the refusal is silent and it lands AFTER our own section-10 filter:
# the filter has already counted the swing and fired the "4 more swings" toast
# when Pick.gml:433 returns false, and that early return also preempts vanilla's
# own "that didn't work" feedback at :455-459 — no sound, no shake, no rumble.
# The player is promised a number and then gets nothing, forever, from a
# position they naturally occupy. A farm animal parked on or behind the unit
# (par_animal is in the same overlap test, and animals can walk onto the
# margins) blocks removal the same silent way.
#
# Vanilla agrees, and the numbers are exact (counted over the shipped
# assets/fiddle/object_prototypes/furniture.toml, 1503 tables): the field is
# mentioned by FIVE tables in the whole game — `[default] = false` and the four
# walkable terrain bridges `farm_bridge` / `gemstone_bridge_v1..v3` = true, all
# of them 16-wide, `on_twos_only`, no inventory. All 62 prototypes that carry an
# `[X.interaction_chest]` sub-table inherit the `[default]` false. There is no
# `check_pick` chest in the game and this must not be the first one: "walkable
# terrain you cannot yank out from under yourself" costs a player nothing, a
# 54-slot chest you cannot remove while a chicken stands behind it is a support
# ticket. The five-swing guard in section 10 of gml/network.gml is the sole
# removal protection, which is what it was designed to be.

[netstor_heart]
	size = [4, 2]
	collision_grid = [
		"0110",
		"0110",
	]

	[netstor_heart.south]
		sprite = "spr_furniture_netstor_heart_closed"
		offset = [16, 0]
		# CONNECTED-state glow: an independent obj_node_renderer_top overlay, never
		# re-applied across lid animations, no shadow-manifest entry needed.
		# depth_offset 1 puts the glow one step in front of the unit body.
		top_sprite = "spr_furniture_netstor_heart_glow"
		top_sprite_depth_offset = 1

	[netstor_heart.interaction_chest]
		open_sprite = "spr_furniture_netstor_heart_opened"
		opening_sprite = "spr_furniture_netstor_heart_opening"
		bounce_sprite = "spr_furniture_netstor_heart_bounce"
		inventory_size = 54

[netstor_block]
	size = [4, 2]
	# Walkable outer columns — see the header note.
	collision_grid = [
		"0110",
		"0110",
	]

	[netstor_block.south]
		sprite = "spr_furniture_netstor_block_closed"
		offset = [16, 0]
		# CONNECTED-state glow — see netstor_heart.south for the full note.
		top_sprite = "spr_furniture_netstor_block_glow"
		top_sprite_depth_offset = 1

	[netstor_block.interaction_chest]
		open_sprite = "spr_furniture_netstor_block_opened"
		opening_sprite = "spr_furniture_netstor_block_opening"
		bounce_sprite = "spr_furniture_netstor_block_bounce"
		inventory_size = 30

[netstor_panel]
	size = [4, 2]
	# Walkable outer columns — see the header note.
	collision_grid = [
		"0110",
		"0110",
	]

	[netstor_panel.south]
		sprite = "spr_furniture_netstor_panel_closed"
		offset = [16, 0]
		# CONNECTED-state glow — see netstor_heart.south for the full note.
		top_sprite = "spr_furniture_netstor_panel_glow"
		top_sprite_depth_offset = 1

	[netstor_panel.interaction_chest]
		open_sprite = "spr_furniture_netstor_panel_opened"
		opening_sprite = "spr_furniture_netstor_panel_opening"
		bounce_sprite = "spr_furniture_netstor_panel_bounce"
		inventory_size = 4

# --- THE FOUR CONNECTORS (Beta 1.3) ------------------------------------------
#
# netstor_link_carpet / netstor_link_tile / netstor_link_cables / netstor_link_cloud.
# Hand-authored units, like heart/block/panel above -- NOT generated twins, and
# not touched by make_fiddle.py. Rug-layer prototypes, not chests: no
# inventory, no interaction, no collision. Shape copied verbatim from
# vanilla's smallest rug, `void_flagstone_small_v1`
# (fiddle/object_prototypes/furniture.toml:14132-14140 in the game corpus):
# size [2, 2], depth_to_floor = true, collision_grid = "0", rug = true. All
# 144 vanilla rugs agree on this shape unanimously (measured).
#
# collision_grid = "0" IS AN ASSERT-SATISFIER ONLY, never an applied hitbox.
# create_furniture_prototype requires every cell of a rug's collision_grid to
# read 0 (Furniture.gml:550-561, the array default when the key is absent is
# a grid FLOODED WITH 1 -- GridUtils.gml:533-534 -- so the key must be present
# and zero), but write_furniture_to_location never writes rug collision at
# all: a rug cell writes ONLY node_rug_id/node_rug_parent
# (Furniture.gml:668-675), full stop. There is no hitbox here to reason about,
# in either direction, and therefore no exposure to the load-order near-miss
# this file's header describes for the units -- Furniture.gml:1966 skips the
# Ari collision test unconditionally for any prototype with rug = true.
#
# NO interaction_chest (a connector holds nothing -- it never enters
# STORAGE_NODES, which is gated on `node.inventory != undefined`,
# Furniture.gml:869-874). NO child_grid (moot for a rug regardless: the
# child-grid descent is gated on `proto.rug == false` at both
# Furniture.gml:592-609 and the placement preview's :1640, so a connector can
# never land on or open a tabletop). NO check_pick (see this file's header for
# why it was reverted for the units; a connector has no inventory to guard, so
# it needs no removal protection of any kind -- yads_pick_target declines a
# rug-only cell outright and hands the swing straight to vanilla,
# network.gml:2836-2853). NO footstep (an object picked up off a connector's
# footprint would silently strip it, GridUtils.gml:377-379 -- see H12).
#
# top_sprite is the CONNECTED-state glow overlay, wired like every other unit
# in this file. Three of the four use top_sprite_depth_offset = 1; the Cloud
# uses 2, because its BODY lives in the overlay 12px above a ground shadow and
# needs the extra depth step to stay in front of a unit on the row behind it.
# The float itself lives in the art's pivot values; the depth offset is the
# one prototype field where the Cloud differs.
#
# BUT THE FLAT THREE'S OVERLAY DEPTH IS NOT DECIDED HERE ANY MORE, and this
# field is no longer the thing to reach for if their glow draws wrong.
# top_sprite_depth_offset is an offset from ORDINARY Y-SORT
# (Furniture.gml:952), which for a rug is the wrong band entirely: a carpet's
# glow y-sorted against a crate standing on that carpet paints over the crate's
# face, which is exactly what it did through Beta 1.3. yads_glow_apply now pins
# the carpet's, the tile's and the cable bundle's overlay to get_floor_depth()
# - 1 every frame -- above their own body, below every actor. The 1 below is
# what those three wear only in the fraction of a second before the glow cache
# first reaches them, and there is no prototype spelling of "floor band" to
# replace it with. The Cloud's 2 is still live and still load-bearing: it is
# the one of the four that is meant to y-sort.
#
# A connector and a decorative rug cannot share a cell -- one rug layer, one
# occupant per cell (GridUtils.gml:71-75). A connector laid under a placed
# unit, and a unit standing on top of a connector, are both allowed
# (GridUtils.gml:76-82).

[netstor_link_carpet]
	size = [2, 2]
	depth_to_floor = true
	collision_grid = "0"
	rug = true

	[netstor_link_carpet.south]
		sprite = "spr_furniture_netstor_link_carpet"
		top_sprite = "spr_furniture_netstor_link_carpet_glow"
		top_sprite_depth_offset = 1

[netstor_link_tile]
	size = [2, 2]
	depth_to_floor = true
	collision_grid = "0"
	rug = true

	[netstor_link_tile.south]
		sprite = "spr_furniture_netstor_link_tile"
		top_sprite = "spr_furniture_netstor_link_tile_glow"
		top_sprite_depth_offset = 1

[netstor_link_cables]
	size = [2, 2]
	depth_to_floor = true
	collision_grid = "0"
	rug = true

	[netstor_link_cables.south]
		sprite = "spr_furniture_netstor_link_cables"
		top_sprite = "spr_furniture_netstor_link_cables_glow"
		top_sprite_depth_offset = 1

[netstor_link_cloud]
	size = [2, 2]
	depth_to_floor = true
	collision_grid = "0"
	rug = true

	[netstor_link_cloud.south]
		sprite = "spr_furniture_netstor_link_cloud"
		top_sprite = "spr_furniture_netstor_link_cloud_glow"
		# 2, not the other units' 1: the cloud's BODY lives in the overlay, drawn
		# 12px above a ground-level shadow base. The extra depth step keeps the
		# floating body in front of a unit standing on the row behind it.
		top_sprite_depth_offset = 2

# ==== BEGIN GENERATED CRATE TWINS -- make_fiddle.py -- DO NOT EDIT BY HAND ====
#
# 59 chest twins -- one per player-placeable vanilla chest.  GENERATED by
# make_fiddle.py from crates/_geom.py; edit that pipeline, never these lines.
#
# EVERY KEY BELOW IS FROZEN THE MOMENT IT SHIPS, for the reason at the top of
# this file: Grid.gml:1075-1082 drops a saved node whose object_id string no
# longer resolves, WITH ITS WHOLE INVENTORY.  So is every inventory_size --
# Grid.gml:1139-1145 force-resizes a loaded chest to the CURRENT prototype size
# and Inventory.gml:49-52 pops the trailing slots UNDRAINED, so lowering one
# silently deletes the tail of every save that used it.
#
# THE BODY IS THE VANILLA CHEST'S OWN SPRITE, named by string: a mod prototype
# may name a vanilla asset (Furniture.gml:216).  That is why there is no body
# art in this mod for any of the 59, and why each twin inherits vanilla's
# poly_ collision shape, its shadow_manifest entry, its item icon and that
# icon's outlines.json entry for free.  The network identity is entirely the
# per-FAMILY top_sprite glow overlay, which crates/fam_<family>.py draws.
#
# NO collision_grid EXCEPT WHERE THE SOURCE CHEST HAD ONE.  The netstor set's
# squeeze-between margins are deliberately NOT extended here: a twin must
# behave like the chest it replaces, "0110" is meaningless on the two 3-wide
# families, and a walkable margin is the only thing that makes the load-order
# near-miss in docs/safety-invariants.md reachable.  The two cottage fridges
# ship collision_grid = "2" (whole-footprint, can_jump_over = false,
# GridUtils.gml:535-536 + :580-585) and their twins copy it.
#
# NO destructable, NO child_grid, NO rule_grid, NO placeable_locations: all
# four are inherited from the game's [default] furniture table, which is what
# the source chests do.  A narrower placeable_locations would be a crate the
# player can never pick up (Pick.gml:452); a child_grid would void the
# five-swing removal guard outright (see the header of this file).
#

