# <---------NETSTOR SET ITEMS------------->
# YADS — network storage furniture (heart / block / panel), the handheld
# remote (Beta 1.2) and the Network Converter (Beta 1.3).
#
# ⚠ THE `netstor_*` KEYS AND `recipe_key`s ARE FROZEN — netstor_heart,
# netstor_block, netstor_panel, netstor_remote, netstor_converter. Item and object keys are
# save-serialized by name; renaming one deletes every placed unit and everything
# inside it from existing saves (see object_prototypes/furniture.toml).
# netstor_remote is frozen for a second reason on top of that one: the binding
# between a player and a Storage Heart IS "a netstor_remote sits in that heart's
# inventory" (there is no mod save data), so the key is what the binding is
# made of. Rename it and every linked heart in every save forgets its remote.
# Field shapes copied verbatim from vanilla `fiddle/items/furniture/basic_chest_set.toml`
# (R4 Q3 / R3 Q4.3). recipe_key groups color/variant siblings; here each item is its own
# recipe family, one-to-one with its object prototype in `object_prototypes/furniture.toml`.

[netstor_heart]
	description = "The anchor of a storage network. Every Block and Panel wired to it shares one pool."
	icon_sprite = "spr_ui_item_netstor_heart"
	name = "Storage Heart"
	recipe_is_default = true
	object = "netstor_heart"
	value = { bin = "self.recipe * 1.1", store = 1250 }
	tags = ["furniture", "netstor_set", "chest_and_storage"]
	crafting_level_requirement = 1
	recipe = [
		{ count = 50, item = "basic_wood" },
		{ count = 5, item = "copper_ingot" },
		{ count = 1, item = "glass" },
		{ hours = 0, minutes = 30 },
	]
	recipe_key = "netstor_heart"

[netstor_block]
	description = "An expansion crate for the network. Adjoin it to a Storage Heart to pool its space."
	icon_sprite = "spr_ui_item_netstor_block"
	name = "Storage Block"
	recipe_is_default = true
	object = "netstor_block"
	value = { store = 400 }
	tags = ["furniture", "netstor_set", "chest_and_storage"]
	crafting_level_requirement = 1
	recipe = [
		{ count = 30, item = "basic_wood" },
		{ count = 1, item = "copper_ingot" },
		{ hours = 0, minutes = 20 },
	]
	recipe_key = "netstor_block"

[netstor_panel]
	description = "A slim terminal wired into the network. Browse, search and sort everything on it."
	icon_sprite = "spr_ui_item_netstor_panel"
	name = "Access Panel"
	recipe_is_default = true
	object = "netstor_panel"
	value = { store = 150 }
	tags = ["furniture", "netstor_set", "chest_and_storage"]
	crafting_level_requirement = 1
	recipe = [
		{ count = 1, item = "copper_ingot" },
		{ count = 1, item = "glass" },
		{ hours = 0, minutes = 10 },
	]
	recipe_key = "netstor_panel"

# The Remote Access Panel — the one item in this set that is NOT a placeable.
#
# NO `object` FIELD, ON PURPOSE. `object` is the arm that makes an item
# placeable (Items.gml:205-213: `prototype.object != undefined` ->
# `prototype.use = ItemUse.PlaceObject`). With it absent — and with no other
# arm of that long if/else chain matching either — `prototype.use` stays
# undefined, so `LiveItem.can_use` returns false on its first line
# (LiveItem.gml:21-24) and `use_item`'s `impossible("unexpected item_use = {}")`
# (use_item.gml:294) is unreachable rather than merely unlikely. The remote
# therefore cannot be dropped into the world as furniture — it lives in a
# backpack or in the heart it is linked to, which is what the binding needs.
#
# NO `restore`, NO `health_modifier`, NO `stamina_modifier`. Items.gml:135-136
# INFERS `edible` from those two being present, and an edible remote would be
# eaten (and destroyed) by a mis-click on the hotbar.
#
# TAGS: netstor_set puts it in the mod's own "Digital Storage" crafting
# sub-category (fiddle/ui/crafting/woodcrafting.toml keys on that tag); material
# is the ordinary vanilla shelf tag for a crafted non-placeable. NOT "furniture"
# and NOT "chest_and_storage": both would advertise it as a placeable crate in
# the vanilla Chests & Storage list, which it is not. "material" is also not an
# infusion-supported tag anywhere in fiddle/infusions.toml, so a remote can
# never carry an infusion — which is what makes every remote in a save
# partial_eq to every other one, and therefore makes "does this heart hold a
# remote" a plain item_id question.
#
# VALUE: `store` only, so `bin` derives as store * 0.5 (Items.gml:6-16). 1000
# sits below the heart's 1250 — the heart stays the set's ceiling on both the
# store and the bin scale (its bin is 731 against this one's 500) — while
# staying clearly above the block. Deliberately far under what the recipe costs
# to assemble (1725 in bin terms): this is a tool you keep, not stock you flip,
# and letting `bin` track the recipe would have put a 1900g sell price on it.
[netstor_remote]
	description = "Links to a Storage Heart. Press F6 to browse that network from anywhere."
	icon_sprite = "spr_ui_item_netstor_remote"
	name = "Remote Access Panel"
	recipe_is_default = true
	value = { store = 1000 }
	tags = ["netstor_set", "material"]
	crafting_level_requirement = 3
	recipe = [
		{ count = 5, item = "ore_ruby" },
		{ count = 5, item = "ore_sapphire" },
		{ count = 5, item = "copper_ingot" },
		{ count = 5, item = "iron_ingot" },
		{ count = 1, item = "netstor_panel" },
		{ hours = 0, minutes = 45 },
	]
	recipe_key = "netstor_remote"

# The Network Converter — the second non-placeable in the set, and THE ONLY
# SOURCE OF THE 59 CRATE TWINS. Hold it and interact with a placed vanilla
# chest to turn that chest into its networked twin; hold it and interact with a
# placed crate to turn it back. Contents survive both directions; one converter
# is consumed per conversion.
#
# THE KEY IS FROZEN THE MOMENT THIS SHIPS, like every other key in this file,
# and for the ordinary reason (Grid.gml:1075-1080). It is a weaker freeze than
# netstor_remote's — nothing is *bound* to a converter and none is ever stored
# in a node — but a rename still deletes every converter sitting in every
# player's backpack.
#
# NO `object` FIELD, for exactly the reason written over netstor_remote above:
# `object` is the arm that sets `prototype.use = ItemUse.PlaceObject`
# (Items.gml:205-213), and a converter that could be dropped into the world as
# furniture would be a chest-shaped hole in the gesture grammar. NO `restore`,
# NO `health_modifier`, NO `stamina_modifier` either — Items.gml:135-136 infers
# `edible` from the last two and an edible converter is one hotbar mis-click
# from gone.
#
# TAGS ARE THE REMOTE'S, VERBATIM: netstor_set puts it in the mod's own
# "Digital Storage" crafting sub-category (fiddle/ui/crafting/woodcrafting.toml
# selects on that tag and needs no edit for a new member), and material is the
# vanilla shelf tag for a crafted non-placeable. NOT "furniture" — it is an
# infusion-supported tag (fiddle/infusions.toml) and an infused converter would
# be a second LiveItem shape for `yads_converter_slot` to match — and NOT
# "chest_and_storage", which would advertise a non-placeable in the vanilla
# Chests & Storage list.
#
# CRAFTING LEVEL 1, NOT THE REMOTE'S 3, AND THE NUMBER IS FORCED RATHER THAN
# CHOSEN. This item is the only way a crate twin can ever exist: gate it at 3
# and 59 of the mod's 62 units are unreachable on a fresh save while
# netstor_block — a level-1 recipe for the same job — is craftable from the
# first day. The remote sits at 3 because it is a convenience over a network
# you already own; the converter is the network's content.
#
# THE RECIPE IS THE ACCESS PANEL'S, EXACTLY: 1 copper_ingot + 1 glass, 10
# minutes. Cheap on purpose. A converter is spent per chest and a farm has
# dozens of chests, so anything dearer turns a one-gesture feature into
# bookkeeping. What stops it being an exploit is that it converts rather than
# creates: the player already paid for the chest, and the twin's `value` is the
# source chest's own two numbers (fiddle/items/furniture/netstor_crates.toml),
# so no conversion moves a single gold piece of sale value.
#
# VALUE: `store` only, so `bin` derives as store * 0.5 (Items.gml:6-16). 150 is
# the Access Panel's, which is the item it costs the same to make. Deliberately
# NOT recipe-derived: `self.recipe * 1.1` on a two-ingredient recipe is a
# rounding argument nobody needs, and a flat number cannot drift when a vanilla
# ingot is re-priced.
[netstor_converter]
	description = "Rewires a placed chest into your storage network, or back again. Contents are kept."
	icon_sprite = "spr_ui_item_netstor_converter"
	name = "Network Converter"
	recipe_is_default = true
	value = { store = 150 }
	tags = ["netstor_set", "material"]
	crafting_level_requirement = 1
	recipe = [
		{ count = 1, item = "copper_ingot" },
		{ count = 1, item = "glass" },
		{ hours = 0, minutes = 10 },
	]
	recipe_key = "netstor_converter"

# --- THE FOUR CONNECTORS (Beta 1.3) -----------------------------------------
# Magic Carpet / Magic Tile / Bundle of Cables / Cloud Connector -- rug-layer
# placeables, never chests. Field shapes copied verbatim from vanilla's own
# rug item template, `starter_stone_path`
# (fiddle/items/furniture/starter_farm_set.toml:68-77 in the game corpus):
# `object` names the prototype 1:1, tags carry "furniture" (the vanilla
# placeable convention -- every rug item ships it) and "ground_decor"
# (vanilla's own rug/path shelf tag). Deliberately NOT "chest_and_storage":
# that tag is the vanilla Chests & Storage sub-category and a connector is
# not a chest.
#
# "netstor_set" is what puts all four in this mod's own "Digital Storage"
# crafting sub-category with NO edit to
# fiddle/ui/crafting/woodcrafting.toml -- that file selects on
# `tags = ["netstor_set"]` alone, and its own header already says a new set
# member is picked up automatically.
#
# `value = { store = N }` ONLY -- the same flat, drift-proof form
# netstor_block/_panel/_converter use above, never `bin = "self.recipe * 1.1"`,
# which docs/safety-invariants.md documents as a hazard class for a
# recipe-having item read by the wrong ident. Values are cheap and ordered by
# recipe cost: fiber-only cheapest, the furnace-gated Cloud dearest.
#
# ALL FOUR KEYS ARE FROZEN THE MOMENT THIS SHIPS, for the same reason as every
# other key in this file (Grid.gml:1075-1080) -- a materially weaker freeze
# than the placeable units' or the remote's, because a connector never holds
# an inventory to lose on a rename.
#
# ALL FOUR ARE ALSO IN boot.gml's ITEM_KEYS (gml/boot.gml section 4): they
# carry a recipe, and recipe_is_default never fires on an existing save, so
# an item missing from that list would be locked forever on every save that
# predates this update.

[netstor_link_carpet]
	description = "Wires everything it touches into the network."
	icon_sprite = "spr_ui_item_netstor_link_carpet"
	name = "Magic Carpet"
	recipe_is_default = true
