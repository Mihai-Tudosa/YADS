# YADS -- the value badges' own sprite font.
#
# MOMI merges this ONE key into the game's fonts/sprite_fonts.toml.  It is a
# clone of vanilla [item_count] (same sprite geometry, same thirteen glyphs,
# same advances) extended with `k` and `m`, because the badge abbreviates and
# item_count cannot spell it: Anchor.gml:1092-1107 SKIPS an unknown character
# without advancing x_off and anchor_utils.gml:2542 scores it 0, so "1.2k" in
# item_count would both draw and measure as "1.2".
#
# GENERATED BY make_art.py -- edit that, not this.  The advances below and the
# pixels in spr_ui_hud_font_netstor_count.png are one design; make_art.py's
# audit_font_strings() composes every string the mod can emit and fails if any
# glyph loses a lit pixel to the next one.
#
# Fonts.gml:15-21 asserts every `characters` key occurs in `order` AND that
# the two have the same length, at boot, for EVERY font in the merged file.

[netstor_count]
	sprite = "spr_ui_hud_font_netstor_count"
	order = "0123456789./+km"
	characters."0" = 4
	characters."1" = 3
	characters."2" = 4
	characters."3" = 4
	characters."4" = 4
	characters."5" = 4
	characters."6" = 4
	characters."7" = 4
	characters."8" = 4
	characters."9" = 4
	characters."." = 2
	characters."/" = 3
	characters."+" = 4
	characters."k" = 4
	characters."m" = 4
